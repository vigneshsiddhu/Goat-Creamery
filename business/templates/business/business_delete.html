{% extends "base.html" %}
{% block title %}
Delete Business
{% endblock %}
{% block content %}
<h1>Delete Business</h1>
<p>
    Are you sure you want to delete:
</p>
<h3>
    {{ business.name }}
</h3>
<form method="POST">
    {% csrf_token %}
    <button type="submit">
        Yes, Delete
    </button>
    <a href="{% url 'business:list' %}">
        Cancel
    </a>
</form>
{% endblock %}
