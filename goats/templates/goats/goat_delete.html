{% extends "base.html" %}


{% block title %}
Delete Goat
{% endblock %}


{% block content %}

<div class="business-page">

    <div class="business-form-card">


        <div class="business-form-header">

            <div class="business-form-header-content">

                <div>

                    <h5>
                        Delete Goat
                    </h5>

                    <p>
                        Confirm goat deletion.
                    </p>

                </div>


                <a href="{% url 'goats:list' %}"
                   class="business-back-btn">

                    <i class="bi bi-arrow-left"></i>

                    Back

                </a>

            </div>

        </div>



        <div class="business-form-body">

            <p>

                Are you sure you want to delete goat

                <strong>
                    {{ goat.token_no }}
                </strong>?

            </p>


            <form method="POST">

                {% csrf_token %}


                <div class="business-form-actions">

                    <a href="{% url 'goats:list' %}"
                       class="business-cancel-btn">

                        Cancel

                    </a>


                    <button type="submit"
                            class="business-save-btn"
                            style="background:#DC2626;border-color:#DC2626;">

                        <i class="bi bi-trash"></i>

                        Delete Goat

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
